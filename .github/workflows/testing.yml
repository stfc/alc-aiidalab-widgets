name: ci-testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  style-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/ruff-action@v3
      with:
        args: "check"
        version: "0.15.10"

    - uses: astral-sh/ruff-action@v3
      with:
        args: "format --check"
        version: "0.15.10"

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and requirements
        run: |
          python -m pip install --upgrade pip
          pip install --group test .

      - name: Run the test suite \w coverage
        if: contains(matrix.python-version, '3.12')
        run: pytest --cov=alc_aiidalab_widgets --cov-report xml:coverage.xml

      - name: Run the test suite without coverage
        if:  ${{ !contains(matrix.python-version, '3.12') }}
        run: pytest

      - name: Report coverage to Coveralls
        if: contains(matrix.python-version, '3.12')
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          base-path: aiidalab_alc

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        run: |
          python -m pip install --upgrade pip
          pip install --group docs .

      - name: Build the documentation
        run: sphinx-build -b html docs/src/ docs/build/html
